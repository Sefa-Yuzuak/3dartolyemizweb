server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS kenar katmanda (Traefik) sonlanıyor; nginx isteği http olarak görür ve
    # mutlak Location kurunca şemayı http'ye düşürür. ÖLÇÜLDÜ: /ankara-3d-baski
    # isteği `Location: http://artolyemiz.com/ankara-3d-baski/` döndürüyor, tarayıcı
    # http'ye iniyor ve Traefik onu tekrar https'e çeviriyor — üç durak. Göreli
    # Location şemayı koruyor, zincir tek durağa iniyor.
    absolute_redirect off;
    port_in_redirect off;

    # ÖLÇÜLDÜ: https://www.artolyemiz.com/ 200 dönüyordu, yani her sayfa iki ayrı
    # ana bilgisayarda erişilebilirdi. Canonical apex'i gösteriyor ama tarama
    # bütçesini iki katına çıkarmanın anlamı yok. www kalıcı olarak apex'e gitsin.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/xml image/svg+xml application/manifest+json;

    # NGINX TUZAĞI — CANLIDA ÖLÇÜLDÜ: add_header yalnızca alt blokta HİÇ add_header
    # yoksa miras alınır. `location = /index.html` kendi Cache-Control'ünü eklediği
    # anda sunucu düzeyindeki üç güvenlik başlığı düşüyordu; ana sayfada canlıda
    # tek başlık kalmıştı. Bu yüzden başlıklar her location'da tekrarlanıyor.
    #
    # http -> https yönlendirmesini Traefik yapıyor ve 302 döndürüyor; oraya
    # müdahale edemiyoruz. HSTS ile tarayıcı sonraki ziyaretlerde doğrudan https
    # ister, yani geçici yönlendirme hiç kurulmaz.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # HTML her zaman tazelensin; ürün sayfaları elle güncelleniyor.
    location ~* \.html$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~* ^/(robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # İKİ DÜZELTME. (1) `expires` kendi Cache-Control'ünü ekliyor; add_header ile
    # birlikte İKİ Cache-Control başlığı çıkıyordu, tek başlıkta toplandı.
    # (2) Eski ayar `expires 1y` + `immutable` idi ama bu sitenin varlık adları
    # içerik damgalı DEĞİL (assets/css/style.css, assets/js/main.js). "immutable"
    # verilince style.css'te yapılan bir düzeltme ziyaretçide bir yıl boyunca
    # görünmüyordu ve adı değiştirmeden temizlemenin yolu yoktu. 30 gün, damgasız.
    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|woff2?|ico|avif)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ESKI MAGAZA ADRESLERI — ÖLÇÜLDÜ 20.09.2026: sitenin arama görünürlüğünün
    # %95'i burada duruyordu. Statik siteye geçerken WooCommerce'in
    # /magaza/, /urun-kategori/ ve /urun-etiketi/ adresleri 404'e düştü:
    # 61 sayfa · 1.079 gösterim · 27 tıklama (canlı üç sayfada toplam 60
    # gösterim var). En büyüğü tek başına 494 gösterim, konum 7,1.
    #
    # Google bu adresleri hâlâ "dizine eklendi" tutuyordu (en son 08.07.2026'da
    # taranmış, yani 404'ü görmemiş) — 301 şimdi verilirse değer canlı sayfalara
    # geçer, Google düşürdükten sonra geçmez. Ürün görselleri ve açıklamaları
    # kurtarılamadığı için uydurma ürün sayfası açılmadı; her adres konu olarak
    # en yakın canlı sayfaya bağlandı.
    #
    # `^~` kullanılıyor: önek eşleşmesi regex location'lardan önce gelir ve en
    # uzun önek kazanır, yani anahtarlık kuralı genel /magaza/ kuralını yener.
    location ^~ /magaza/oyun-oyuncu/anahtarlik/ { return 301 /urun/detayli-anahtarlik-figur/; }
    location ^~ /magaza/         { return 301 /urun/; }
    location ^~ /urun-kategori/  { return 301 /urun/; }
    location ^~ /urun-etiketi/   { return 301 /urun/; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store";
    }
}
