    location = /magaza/oyun-oyuncu/mickey-mouse-kalemlik/ { return 301 /urun/kopekbaligi-kalemlik/; }
    location = /magaza/ev-yasam/saksi/groot-kalemlik/ { return 301 /urun/kopekbaligi-kalemlik/; }
    location = /magaza/ev-yasam/dekorasyon/ucan-balonlu-ayicik-biblo-figur/ { return 301 /urun/balonlu-ayicik-biblo/; }
    location = /magaza/ev-yasam/dekorasyon/semsiyeli-ayicik-biblo-figur/ { return 301 /urun/balonlu-ayicik-biblo/; }
    location = /magaza/ev-yasam/dekorasyon/tabak-tutan-ayicik-biblo/ { return 301 /urun/balonlu-ayicik-biblo/; }
    location = /magaza/ev-yasam/mutfak/yumurta-tutucu/ { return 301 /urun/yumurta-tutucu/; }
    location = /magaza/ev-yasam/mutfak/otomatik-2-katli-buzdolabi-yumurta-organizeri/ { return 301 /urun/yumurta-tutucu/; }
    # /URUN-YONLENDIRMELERI
    location ^~ /magaza/oyun-oyuncu/anahtarlik/ { return 301 /urun/detayli-anahtarlik-figur/; }
    location ^~ /magaza/         { return 301 /urun/; }
    location ^~ /urun-kategori/  { return 301 /urun/; }
    location ^~ /urun-etiketi/   { return 301 /urun/; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store";
    }
}
